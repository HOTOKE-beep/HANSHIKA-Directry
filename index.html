<script>

const hiddenMessages = {
black: "Tathastu 🗿",
glasses: "Kya re double battery",
golgappa: "10 le 5 aate wale 10 ke 4 suzi wale 👹",
cat: "Kukul khulhadibaaz 😼",
dog: "Manjit ka ladka ooi 👺",
celebrity: "Piddi 🗿🐿️🤏"
};

let clicked = {
black:false,
glasses:false,
golgappa:false,
cat:false,
dog:false,
celebrity:false
};

let finalTriggered = false;

// reveal function + tracking
function reveal(type){
document.getElementById("comfort-box").innerText = hiddenMessages[type];
clicked[type] = true;
checkFinalUnlock();
}

// FINAL CHECK
function checkFinalUnlock(){
const allDone = Object.values(clicked).every(v => v === true);

if(allDone && !finalTriggered){
finalTriggered = true;

setTimeout(()=>{
document.getElementById("overlay").style.display = "flex";
document.querySelector(".overlay h2").innerText = "🖤 Final Message";
document.querySelector(".overlay p").innerHTML = "Take care of yourself, kid 🌙";
},800);

}
}

// CLOSE → END SEQUENCE
function closeOverlay(){

// hide popup
document.getElementById("overlay").style.display = "none";

// destroy everything
document.body.innerHTML = "";

// create final screen
const end = document.createElement("div");
end.style.height = "100vh";
end.style.display = "flex";
end.style.flexDirection = "column";
end.style.justifyContent = "center";
end.style.alignItems = "center";
end.style.background = "black";
end.style.color = "white";
end.style.fontSize = "2rem";
end.style.fontFamily = "Arial";
end.style.textAlign = "center";

end.innerHTML = `<div id="type"></div>`;
document.body.appendChild(end);

// typewriter effect
const text = "Made by HOTOKE";
let i = 0;

function type(){
if(i < text.length){
document.getElementById("type").innerHTML += text.charAt(i);
i++;
setTimeout(type,120);
}
}

setTimeout(type,600);
}

// typewriter intro
const text = "Hey Piddi Gilheri 🐿️";
let i = 0;

function typeWriter(){
if(i < text.length){
document.getElementById("typewriter").innerHTML += text.charAt(i);
i++;
setTimeout(typeWriter,100);
}
}
typeWriter();

// random messages
const messages = [
"You don’t always have to act strong here 🖤",
"Tiny celebrity detected ✨",
"Drink water, piddi gilheri 🐿️",
"The world feels softer with you in it 🌙"
];

function showMessage(){
document.getElementById("comfort-box").innerText =
messages[Math.floor(Math.random()*messages.length)];
}

function squirrelMessage(){
alert("Emergency squirrel hug deployed 🐿️🫂");
}

// stars
const stars=document.getElementById("stars");
for(let i=0;i<45;i++){
const s=document.createElement("div");
s.className="star";
s.innerText="✦";
s.style.left=Math.random()*100+"%";
s.style.top=Math.random()*100+"%";
stars.appendChild(s);
}

// cursor
const cursor=document.getElementById("cursor");
document.addEventListener("mousemove",e=>{
cursor.style.left=e.clientX+"px";
cursor.style.top=e.clientY+"px";
});

</script>
